name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - name: Check for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Install isolated D-Bus test support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dbus
      - run: go test -race ./...
      - run: go build -o bin/op-go ./cmd/op-go
      - name: Noninteractive command contract
        shell: bash
        run: |
          set -euo pipefail
          export NO_COLOR=1
          bin/op-go --skill </dev/null | cat > skill-output.md
          set +e
          bin/op-go doctor --backend file --token-file /nonexistent/op-go-token --json </dev/null | cat > doctor.json
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 3
          python3 -c 'import json; assert json.load(open("doctor.json"))["ok"] is False'
  release-infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y dpkg-dev apt-utils gnupg shellcheck
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: shellcheck scripts/*.sh packaging/scripts/*.sh
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Package and install through disposable signed apt repository
        env:
          OP_GO_VERSION: '0.0.0'
          OP_GO_COMMIT: ${{ github.sha }}
          OP_GO_DATE: '1970-01-01T00:00:00Z'
        run: |
          for arch in amd64 arm64; do
            bash scripts/build-linux.sh "$arch" "build/op-go-$arch"
            bash packaging/scripts/package.sh "$OP_GO_VERSION" "linux-$arch" "build/op-go-$arch" dist
          done
          bash packaging/scripts/test-apt.sh dist "$OP_GO_VERSION"
      - run: python3 scripts/check-release-profile.py RELEASE-TRAIN.md
