name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - name: Install isolated D-Bus test support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dbus
      - run: go test -race ./...
      - run: go build -o bin/op-go ./cmd/op-go
      - name: Noninteractive command contract
        shell: bash
        run: |
          set -euo pipefail
          export NO_COLOR=1
          bin/op-go --skill </dev/null | cat > skill-output.md
          set +e
          bin/op-go doctor --backend file --token-file /nonexistent/op-go-token --json </dev/null | cat > doctor.json
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 3
          python3 -c 'import json; assert json.load(open("doctor.json"))["ok"] is False'
